[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-analysis-lib"
version = "0.1.0"
description = "Typed, numpy-backed technical indicators (SMA/EMA/MACD/RSI/Stochastic/KDJ/Bollinger/ATR/OBV)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Chunyang Gao" }]
keywords = ["quant", "technical-analysis", "indicators", "rsi", "macd", "trading"]

[tool.setuptools.packages.find]
include = ["indicators*"]
